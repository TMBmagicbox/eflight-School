<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>eFlight School</title>
<meta name="description" content="eFlight School">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>
<body data-page="contact">
<div id="hdr"></div>
<section class="pagehead"><div class="wrap"><h1 data-i18n="ct_h"></h1><p data-i18n="slogan"></p></div></section>
<section><div class="wrap contact">
 <div><p><b data-i18n="ct_email_l"></b><br>✉️ <a href="mailto:info@eflightschool.com">info@eflightschool.com</a></p><br>
  <p><b data-i18n="ct_phone_l"></b><br>📞 <a href="tel:+17868463505">+1 (786) 846 3505</a></p></div>
 <div><h2 data-i18n="ct_send_h"></h2><p style="color:var(--mut);margin:8px 0 16px" data-i18n="ct_send_p"></p>
 <form onsubmit="event.preventDefault();toast(t('toast_sent'));this.reset()">
  <input required data-i18n-ph="ph_name"><input data-i18n-ph="ph_phone"><input required type="email" data-i18n-ph="ph_mail">
  <select><option data-i18n="o1"></option><option data-i18n="o2"></option><option data-i18n="o3"></option><option data-i18n="o4"></option></select>
  <textarea rows="4" data-i18n-ph="ph_msg"></textarea><button class="btn" data-i18n="send"></button>
 </form></div></div></section>
<div id="ftr"></div>
