<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyLearn Aviación | Cursos online de aviación</title>
<meta name="description" content="Plataforma de cursos online de aviación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1d3a;--navy2:#12305f;--sky:#2ea3f2;--amber:#ffb703;--bg:#f5f8fc;--ink:#14213d;--mut:#5b6b85;--card:#fff;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:800;font-size:1.25rem;display:flex;gap:8px;align-items:center}
.logo svg{width:28px;height:28px}
nav ul{display:flex;gap:26px;list-style:none;font-size:.92rem}
nav a:hover{color:var(--amber)}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:600;padding:12px 24px;border-radius:999px;background:var(--amber);color:#1b1b1b;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.o{background:transparent;border:2px solid #fff;color:#fff}
.btn.s{padding:8px 16px;font-size:.85rem}
.cartbtn{position:relative;background:none;border:0;color:#fff;cursor:pointer;font-size:1.3rem}
.cartbtn b{position:absolute;top:-8px;right:-10px;background:var(--amber);color:#000;font-size:.7rem;border-radius:999px;padding:0 6px}
.menu{display:none;background:none;border:0;color:#fff;font-size:1.6rem}
#lang{width:auto;padding:6px 12px;border-radius:999px;background:var(--navy2);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:.85rem;cursor:pointer}
#lang option{color:#000}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,#1c4f93);color:#fff;padding:90px 0 110px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;top:-80px;width:520px;height:520px;border-radius:50%;background:radial-gradient(var(--sky),transparent 70%);opacity:.35}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative;z-index:1}
.tag{display:inline-block;background:rgba(255,255,255,.12);padding:4px 14px;border-radius:999px;font-size:.8rem;margin-bottom:16px}
h1{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.15;font-weight:800}
h1 span{color:var(--amber)}
.hero p{margin:18px 0 28px;color:#cfdbf0;max-width:520px}
.hero .btns{display:flex;gap:14px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--r);padding:22px;text-align:center}
.stat b{font-size:1.9rem;color:var(--amber);display:block}
section{padding:80px 0}
.sh{text-align:center;max-width:640px;margin:0 auto 44px}
.sh small{color:var(--sky);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sh h2{font-size:clamp(1.6rem,3vw,2.3rem);margin:6px 0}
.sh p{color:var(--mut)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.feat{background:var(--card);border-radius:var(--r);padding:28px;box-shadow:0 6px 24px rgba(11,29,58,.07)}
.feat i{font-style:normal;font-size:2rem;display:block;margin-bottom:10px}
.feat h3{margin-bottom:6px;font-size:1.05rem}
.feat p{color:var(--mut);font-size:.92rem}
.filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:12px}
.chip{border:2px solid #d5dfee;background:#fff;border-radius:999px;padding:7px 18px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:600;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{display:block;margin:0 auto 34px;width:min(420px,100%);padding:12px 20px;border-radius:999px;border:2px solid #d5dfee;font:inherit}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.course{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 6px 24px rgba(11,29,58,.08);display:flex;flex-direction:column;transition:.25s}
.course:hover{transform:translateY(-6px)}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;position:relative;color:#fff}
.lvl{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.4);font-size:.72rem;padding:2px 12px;border-radius:999px}
.cb{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{font-size:1.02rem;line-height:1.35}
.meta{font-size:.8rem;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.stars{color:var(--amber);font-size:.85rem}
.cf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #edf1f7}
.price{font-weight:800;font-size:1.2rem}
.price s{font-weight:400;color:var(--mut);font-size:.8rem;margin-left:6px}
.how{background:var(--navy);color:#fff}
.how .sh p{color:#b5c4de}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;counter-reset:s}
.step{background:rgba(255,255,255,.07);border-radius:var(--r);padding:28px;counter-increment:s}
.step:before{content:counter(s);display:flex;width:40px;height:40px;border-radius:50%;background:var(--amber);color:#000;font-weight:800;align-items:center;justify-content:center;margin-bottom:12px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;max-width:900px;margin:auto}
.plan{background:#fff;border-radius:var(--r);padding:34px;text-align:center;box-shadow:0 6px 24px rgba(11,29,58,.08)}
.plan.hot{background:var(--navy);color:#fff;transform:scale(1.04)}
.plan .p{font-size:2.3rem;font-weight:800;margin:8px 0}
.plan ul{list-style:none;margin:18px 0 24px;font-size:.92rem;color:var(--mut)}
.plan.hot ul{color:#c9d6ee}
.plan li{padding:5px 0}
.plan li:before{content:"✓ ";color:var(--sky);font-weight:700}
details{background:#fff;border-radius:12px;padding:16px 22px;margin-bottom:12px;box-shadow:0 3px 12px rgba(11,29,58,.06);max-width:760px;margin-inline:auto}
summary{cursor:pointer;font-weight:600}
details p{margin-top:10px;color:var(--mut);font-size:.93rem}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
form{display:grid;gap:12px}
input,textarea,select{width:100%;padding:12px 16px;border:2px solid #d5dfee;border-radius:12px;font:inherit}
footer{background:#07142a;color:#b5c4de;padding:50px 0 24px;font-size:.88rem}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;margin-bottom:30px}
footer h4{color:#fff;margin-bottom:10px}
footer li{list-style:none;padding:3px 0}
.copy{border-top:1px solid #1a2d4d;padding-top:18px;text-align:center}
#drawer{position:fixed;top:0;right:-420px;width:min(400px,100%);height:100%;background:#fff;z-index:100;transition:.3s;box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
#drawer.open{right:0}
#drawer header{position:static;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
#items{flex:1;overflow:auto;padding:14px 22px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f7;font-size:.9rem}
.it .ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff}
.it div{flex:1}
.it button{background:none;border:0;cursor:pointer;color:#c0392b;font-size:1.1rem}
.tot{padding:20px 22px;border-top:1px solid #edf1f7}
.tot .row{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin-bottom:12px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none}
#ov.on{display:block}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:999px;z-index:200;transition:.3s}
#toast.on{transform:translateX(-50%)}
@media(max-width:860px){
 .hero .wrap,.contact,.fg{grid-template-columns:1fr}
 nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--navy);padding:16px 20px}
 nav.open{display:block}
 nav ul{flex-direction:column;gap:14px}
 .menu{display:block}
 .plan.hot{transform:none}
}
</style>
</head>

const KEYS=["all","atc","private","instrument","commercial"];
const SUP=Object.keys(T);
let lang=localStorage.getItem("lang")||(navigator.language||"es").slice(0,2).toLowerCase();
if(!SUP.includes(lang))lang="en";
let cart=JSON.parse(localStorage.getItem("cart")||"[]"),cat="all";
const t=k=>(T[lang]&&T[lang][k])||T.es[k]||k;

function setLang(l){lang=l;localStorage.setItem("lang",l);applyLang()}
function applyLang(){
 document.documentElement.lang=lang;
 document.title=t("title");
 document.querySelector('meta[name=description]').content=t("desc");
 document.getElementById("lang").value=lang;
 document.querySelectorAll("[data-i18n]").forEach(e=>e.innerHTML=t(e.dataset.i18n));
 document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
 buildFilters();render();drawCart();
}
function buildFilters(){
 document.getElementById("filters").innerHTML=KEYS.map(k=>`<button class="chip ${k===cat?'on':''}" onclick="setCat('${k}')">${t('c_'+k)}</button>`).join("");
}
function setCat(k){cat=k;buildFilters();render()}
function render(){
 const q=document.getElementById("q").value.toLowerCase();
 document.getElementById("courses").innerHTML=COURSES.filter(c=>(cat==="all"||c.k===cat)&&c.t[lang].toLowerCase().includes(q)).map(c=>`
 <div class="course"><div class="thumb" style="background:linear-gradient(135deg,${c.g})"><span class="lvl">${t('l_'+c.l)}</span>${c.e}</div>
 <div class="cb"><small style="color:var(--sky);font-weight:700">${t('c_'+c.k)}</small><h3>${c.t[lang]}</h3>
 <div class="meta"><span>⏱ ${c.h} h</span><span>🎬 ${c.n} ${t('lessons')}</span></div>
 <div class="stars">${"★".repeat(Math.round(c.r))} <span style="color:var(--mut)">${c.r}</span></div>
 <div class="cf"><div class="price">$${c.p}<s>$${c.o}</s></div><button class="btn s" onclick="add(${c.id})">${t('add')}</button></div></div></div>`).join("")||`<p style='text-align:center;grid-column:1/-1;color:var(--mut)'>${t('none')}</p>`;
}
function save(){localStorage.setItem("cart",JSON.stringify(cart));drawCart()}
function add(id){if(cart.includes(id))return toast(t("toast_in"));cart.push(id);save();toast(t("toast_added"))}
function rm(id){cart=cart.filter(i=>i!==id);save()}
function drawCart(){
 document.getElementById("cnt").textContent=cart.length;
 const list=cart.map(i=>COURSES.find(c=>c.id===i));
 document.getElementById("items").innerHTML=list.map(c=>`<div class="it"><div class="ic" style="background:linear-gradient(135deg,${c.g})">${c.e}</div><div><b>${c.t[lang]}</b><br>$${c.p}</div><button onclick="rm(${c.id})">🗑</button></div>`).join("")||`<p style='color:var(--mut);padding:20px 0'>${t('empty')}</p>`;
 document.getElementById("total").textContent="$"+list.reduce((s,c)=>s+c.p,0);
}
function toggleCart(){document.getElementById("drawer").classList.toggle("open");document.getElementById("ov").classList.toggle("on")}
function checkout(){if(!cart.length)return toast(t("toast_empty"));toast(t("toast_demo"))}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
applyLang();
</script>
